<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <meta
      name="description"
      content="Profile card component showcasing Victor Crest with follower stats, likes, and photos. Built as a Frontend Mentor challenge using HTML and CSS."
    />
    <meta
      name="keywords"
      content="profile card, frontend mentor, HTML, CSS, responsive design, UI component, web development, user profile"
    />
    <meta name="author" content="Ruben de Man" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Profile card component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <article class="profile-card">
        <img
          class="profile-card__cover"
          src="./images/bg-pattern-card.svg"
          alt=""
        />

        <div class="profile-card__header">
          <img
            class="profile-card__avatar"
            src="./images/image-victor.jpg"
            alt="Portrait of Victor Crest"
            loading="lazy"
          />
          <h2 class="profile-card__title">
            Victor Crest, <span class="profile-card__age">26</span>
          </h2>
          <span class="profile-card__location">London</span>
        </div>
        <ul class="profile-card__list">
          <li class="profile-card__item">
            <span class="profile-card__item-number">80K</span>
            <span>Followers</span>
          </li>
          <li class="profile-card__item">
            <span class="profile-card__item-number">803K</span>
            <span>Likes</span>
          </li>
          <li class="profile-card__item">
            <span class="profile-card__item-number">1.4K</span>
            <span>Photos</span>
          </li>
        </ul>
      </article>
    </main>

    <footer class="attribution">
      <p class="attribution__text">
        Challenge by
        <a
          class="attribution__link"
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer"
          >Frontend Mentor</a
        >. Coded by
        <a
          class="attribution__link"
          href="https://rubendeman.nl"
          target="_blank"
          rel="noopener noreferrer"
          >Ruben de Man</a
        >.
      </p>
    </footer>
  </body>
</html>
